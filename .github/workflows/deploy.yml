name: Build Check

# 배포는 Netlify Git 연동(rara-todo-calendar)이 담당하고,
# 이 워크플로는 빌드가 깨지지 않는지만 확인한다.
on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      # Netlify 빌드 명령과 동일하게 npm install 사용
      # (lock 파일의 netlify-cli 하위 플랫폼 패키지 때문에 npm ci는 EBADPLATFORM 실패)
      - name: Install dependencies
        working-directory: frontend
        run: npm install

      - name: Build frontend
        working-directory: frontend
        run: npm run build
